name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm before setup-node resolves the pnpm cache location.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high-severity dependencies
        run: pnpm run security:audit

      - name: Build ReScript
        run: pnpm run res:build

      - name: Check formatting
        run: pnpm run res:lint

      - name: Build bundle
        run: pnpm run bundle

      - name: Run tests
        run: pnpm run res:test
